# ---------------------------------------------------------------------------
# Deploy TickDetector
#
# Triggered automatically when code is pushed to 'master'.
# Deploys the Python service and web assets to the production server.
#
# PREREQUISITES:
#   This workflow assumes the server has already been set up for deployment.
#   See docs/server-setup.md for first-time manual setup instructions.
#
# PERMISSIONS MODEL:
#   All deployed files are owned by www-data:actions with g+rw.
#   The 'actions' runner user is a member of the 'actions' group and can
#   write to APP_PATH and WEB_PATH without sudo.
#   Systemd service restart is handled via a passwordless sudoers rule
#   limited to the specific systemctl commands needed.
# ---------------------------------------------------------------------------
name: "Deploy TickDetector"

on:
  push:
    branches:
      - deploy

permissions:
  contents: read

env:
  APP_PATH: /opt/tick-detector
  VENV_PATH: /opt/venvs/tickdetector
  WEB_PATH: /var/www/tick.edcd.io

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, aws, brapps, web]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Verify deployment targets exist
        shell: bash
        run: |
          # Fail fast if the server hasn't been set up yet
          if [ ! -d "${APP_PATH}" ]; then
            echo "ERROR: ${APP_PATH} does not exist."
            echo "Run the first-time server setup before deploying. See docs/server-setup.md"
            exit 1
          fi
          if [ ! -d "${WEB_PATH}" ]; then
            echo "ERROR: ${WEB_PATH} does not exist."
            echo "Run the first-time server setup before deploying. See docs/server-setup.md"
            exit 1
          fi

      - name: Deploy service files
        shell: bash
        run: |
          echo "Deploying tick detector service to ${APP_PATH}"

          rsync -av --omit-dir-times --no-perms --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='www/' \
            --exclude='config/' \
            --exclude='scripts/' \
            --exclude='docs/' \
            --exclude='node_modules/' \
            --exclude='database/' \
            --exclude='Dockerfile' \
            --exclude='docker-compose.yaml' \
            --exclude='.dockerignore' \
            --exclude='venv/' \
            --exclude='__pycache__/' \
            ./ ${APP_PATH}/

      - name: Install/update Python dependencies
        shell: bash
        run: |
          if [ ! -d "${VENV_PATH}" ]; then
            echo "ERROR: Python venv not found at ${VENV_PATH}"
            echo "Run the first-time server setup. See docs/server-setup.md"
            exit 1
          fi

          echo "Installing dependencies..."
          ${VENV_PATH}/bin/pip install --quiet --upgrade pip
          ${VENV_PATH}/bin/pip install --quiet -r ${APP_PATH}/requirements.txt

      - name: Deploy web assets
        shell: bash
        run: |
          echo "Deploying web assets to ${WEB_PATH}"

          # Deploy index.html only if it doesn't already exist — preserve
          # the version updated by the running service with the current tick time
          if [ ! -f "${WEB_PATH}/index.html" ]; then
            cp www/index.html ${WEB_PATH}/index.html
          fi

          # Deploy static documentation page
          cp www/docs.html ${WEB_PATH}/docs.html

          # Deploy CGI script
          cp cgi-bin/ticks.py ${WEB_PATH}/cgi-bin/ticks.py
          #chmod +x ${WEB_PATH}/cgi-bin/ticks.py

      - name: Restart tick detector service
        shell: bash
        run: |
          echo "Restarting tick-detector service..."
          sudo systemctl restart tick-detector

          # Wait a moment and check it started OK
          sleep 3
          if systemctl is-active --quiet tick-detector; then
            echo "Service started successfully."
            systemctl status tick-detector --no-pager
          else
            echo "WARNING: Service failed to start!"
            journalctl -u tick-detector --no-pager -n 20
            exit 1
          fi
