<VirtualHost *:80>
    ServerName tick.edcd.io
    Redirect permanent / https://tick.edcd.io/
</VirtualHost>

<VirtualHost *:443>
    ServerName tick.edcd.io

    DocumentRoot /var/www/tick.edcd.io

    # SSL (adjust paths to match your certificate setup)
    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/tick.edcd.io/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/tick.edcd.io/privkey.pem

    # Serve static files from the web root
    <Directory /var/www/tick.edcd.io>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # /api/tick is a static JSON file
    <Location /api/tick>
        ForceType application/json
        Header set Access-Control-Allow-Origin "*"
    </Location>

    # /api/ticks is handled by the CGI script
    ScriptAlias /api/ticks /var/www/tick.edcd.io/cgi-bin/ticks.py

    <Directory /var/www/tick.edcd.io/cgi-bin>
        Options +ExecCGI
        SetHandler cgi-script
        Require all granted

        # Pass database credentials to CGI via environment
        SetEnv TICK_DB_HOST "localhost"
        SetEnv TICK_DB_PORT "3306"
        SetEnv TICK_DB_USER "tick_detector"
        SetEnv TICK_DB_PASS "CHANGEME"
        SetEnv TICK_DB_NAME "tick_detector"
    </Directory>

    # Block common bot/scanner probes — this site has no PHP or WordPress
    RewriteEngine On
    RewriteRule \.php$ - [R=403,L]
    RewriteRule ^/wp-(admin|login|content|includes) - [R=403,L]
    RewriteRule ^/xmlrpc\.php$ - [R=403,L]
    RewriteRule ^/\.env$ - [R=403,L]
    RewriteRule ^/admin - [R=403,L]
    RewriteRule ^/phpmyadmin - [R=403,L,NC]
    RewriteRule ^/\.git - [R=403,L]

    # Socket.IO reverse proxy (tick detector service on port 9001)
    # Requires: a2enmod proxy proxy_http proxy_wstunnel rewrite
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteRule ^/socket.io/(.*) ws://127.0.0.1:9001/socket.io/$1 [P,L]

    ProxyPass /socket.io http://127.0.0.1:9001/socket.io
    ProxyPassReverse /socket.io http://127.0.0.1:9001/socket.io

    # Standard security headers
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/tick.edcd.io-error.log
    CustomLog ${APACHE_LOG_DIR}/tick.edcd.io-access.log combined
</VirtualHost>
